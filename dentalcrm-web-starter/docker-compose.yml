x-api-env: &api-env
  APP_NAME: ${APP_NAME:-DentalCRM}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_KEY: ${APP_KEY}
  PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-dentalcrm}
  DB_USERNAME: ${DB_USERNAME:-dentalcrm}
  DB_PASSWORD: ${DB_PASSWORD:-dentalcrm}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hola@maxilart.example}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MaxilArt}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123456}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-dentalcrm}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}

x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16
    container_name: dentalcrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dentalcrm}
      POSTGRES_USER: ${DB_USERNAME:-dentalcrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dentalcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dentalcrm} -d ${DB_DATABASE:-dentalcrm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dentalcrm_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: dentalcrm_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: dentalcrm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123456}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: *api-build
    container_name: dentalcrm_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: "8000"
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') !== false ? 0 : 1);"]
      interval: 15s
      timeout: 20s
      start_period: 30s
      retries: 12

  queue:
    build: *api-build
    container_name: dentalcrm_queue
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=0"]

  scheduler:
    build: *api-build
    container_name: dentalcrm_scheduler
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
    command: ["php", "artisan", "schedule:work"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_CLINIC_SLUG: ${VITE_CLINIC_SLUG:-maxilart}
    container_name: dentalcrm_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
